services:
  postgres:
    image: postgres:16-alpine
    container_name: dr_screening_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dr_password}
      POSTGRES_DB: ${POSTGRES_DB:-dr_screening}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dr_user} -d $${POSTGRES_DB:-dr_screening}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: dr_screening_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: dr_screening_postgres_data
  redis_data:
    name: dr_screening_redis_data
